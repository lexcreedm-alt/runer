<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Cotejos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fontsource-poppins@4.5.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fontsource-poppins@4.5.0/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fontsource-poppins@4.5.0/700.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #16213e 100%);
    color: #e4e4e7;
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 30px; padding: 20px; }
  header h1 {
    font-size: 2.2rem;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  header p { color: #94a3b8; font-size: 0.95rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: rgba(30, 30, 50, 0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(99, 102, 241, 0.2);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .card h2 {
    font-size: 1.1rem;
    color: #a78bfa;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(99,102,241,0.2);
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 0.85rem;
    color: #cbd5e1;
    margin-bottom: 6px;
    font-weight: 600;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    background: rgba(15, 15, 30, 0.8);
    border: 1px solid rgba(99, 102, 241, 0.3);
    border-radius: 8px;
    color: #e4e4e7;
    font-family: inherit;
    font-size: 0.9rem;
    transition: all 0.2s;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #60a5fa;
    box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
  }
  
  /* Estilos para inputs numéricos con botones personalizados */
  input[type="number"] {
    -moz-appearance: textfield;
  }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .number-input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .number-input-wrapper input {
    flex: 1;
    text-align: center;
  }
  .spin-btn {
    width: 36px;
    height: 36px;
    border: 1px solid rgba(99, 102, 241, 0.3);
    background: rgba(99, 102, 241, 0.15);
    color: #a78bfa;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1.2rem;
    font-weight: 700;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .spin-btn:hover {
    background: rgba(99, 102, 241, 0.3);
    border-color: #60a5fa;
    transform: scale(1.05);
  }
  .spin-btn:active {
    transform: scale(0.95);
  }
  
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  details {
    background: rgba(15, 15, 30, 0.5);
    border: 1px solid rgba(99,102,241,0.2);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 14px;
  }
  details summary {
    cursor: pointer;
    color: #a78bfa;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 4px 0;
  }
  details[open] summary { margin-bottom: 12px; }
  .btn {
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    width: 100%;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
  .btn-secondary {
    background: rgba(99,102,241,0.15);
    color: #a78bfa;
    border: 1px solid rgba(99,102,241,0.3);
  }
  .btn-secondary:hover { background: rgba(99,102,241,0.25); }
  .btn-danger {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: 1px solid rgba(239,68,68,0.3);
    padding: 6px 10px;
    font-size: 0.8rem;
  }
  .btn-add {
    background: rgba(34, 197, 94, 0.15);
    color: #4ade80;
    border: 1px solid rgba(34,197,94,0.3);
    width: 100%;
    margin-top: 10px;
  }
  .acta-item {
    background: rgba(15, 15, 30, 0.6);
    border: 1px solid rgba(99,102,241,0.2);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    position: relative;
  }
  .acta-item .remove-btn {
    position: absolute;
    top: 8px;
    right: 8px;
  }
  .checkbox-field {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: rgba(15, 15, 30, 0.5);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .checkbox-field input { width: auto; accent-color: #8b5cf6; }
  .checkbox-field label { margin: 0; cursor: pointer; }
  .desglose-row {
    display: grid;
    grid-template-columns: 1fr 120px;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
  }
  .desglose-row label { margin: 0; }
  .desglose-row input { text-align: right; font-weight: 600; }
  .total-row {
    display: grid;
    grid-template-columns: 1fr 120px;
    gap: 10px;
    padding: 12px;
    background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(139,92,246,0.2));
    border-radius: 10px;
    margin-top: 12px;
    font-weight: 700;
    font-size: 1.1rem;
  }
  .total-row span:last-child {
    text-align: right;
    color: #60a5fa;
  }
  footer {
    text-align: center;
    margin-top: 30px;
    color: #64748b;
    font-size: 0.85rem;
  }
  .editable-hint {
    font-size: 0.75rem;
    color: #64748b;
    font-style: italic;
    margin-bottom: 12px;
  }
  .percent-hint {
    font-size: 0.75rem;
    color: #64748b;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Calculadora de Cotejos</h1>
    <p>Para no regarla al calcular cotejos</p>
  </header>

  <div class="grid">
    <!-- COLUMNA IZQUIERDA -->
    <div>
      <div class="card" style="margin-bottom:20px;">
        <h2>Información del Cliente</h2>
        <div class="field">
          <label>Nombre del Cliente</label>
          <input type="text" id="clientName" placeholder="Ej. Juan Pérez">
        </div>
        <div class="field">
          <label>Fecha de entrega de actas</label>
          <input type="date" id="deliveryDate">
        </div>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <h2>Configuración de Precios</h2>
        <details open>
          <summary>▼ Precios base</summary>
          <div class="row-3">
            <div class="field">
              <label>Base (2 hojas)</label>
              <div class="number-input-wrapper">
                <button class="spin-btn" onclick="spinValue('priceBase', -1)">−</button>
                <input type="number" id="priceBase" value="600" min="0" step="1">
                <button class="spin-btn" onclick="spinValue('priceBase', 1)">+</button>
              </div>
            </div>
            <div class="field">
              <label>Adicional (3-99)</label>
              <div class="number-input-wrapper">
                <button class="spin-btn" onclick="spinValue('priceAdd', -1)">−</button>
                <input type="number" id="priceAdd" value="50" min="0" step="1">
                <button class="spin-btn" onclick="spinValue('priceAdd', 1)">+</button>
              </div>
            </div>
            <div class="field">
              <label>Excedente (100+)</label>
              <div class="number-input-wrapper">
                <button class="spin-btn" onclick="spinValue('priceEx', -1)">−</button>
                <input type="number" id="priceEx" value="30" min="0" step="1">
                <button class="spin-btn" onclick="spinValue('priceEx', 1)">+</button>
              </div>
            </div>
          </div>
          <div class="field">
            <label>Tasa IVA (%)</label>
            <div class="number-input-wrapper">
              <button class="spin-btn" onclick="spinValue('ivaRate', -1)">−</button>
              <input type="number" id="ivaRate" value="16" min="0" step="1">
              <button class="spin-btn" onclick="spinValue('ivaRate', 1)">+</button>
            </div>
          </div>
          <button class="btn btn-secondary" onclick="restoreDefaults()">Restaurar valores</button>
        </details>
      </div>

      <div class="card">
        <h2>Actas a Cotejar</h2>
        <div id="actasList"></div>
        <button class="btn btn-add" onclick="addActa()">+ Agregar Acta</button>
      </div>
    </div>

    <!-- COLUMNA DERECHA -->
    <div>
      <div class="card" style="margin-bottom:20px;">
        <h2>Opciones</h2>
        <div class="checkbox-field">
          <input type="checkbox" id="includeIva" checked>
          <label for="includeIva">Facturar</label>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="includeIvaTotal" checked>
          <label for="includeIvaTotal">Incluir IVA en total</label>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="gerryTax">
          <label for="gerryTax">Impuesto Gerry (Recargo por rapidez)</label>
        </div>
        <div class="field" id="gerryField" style="display:none; margin-top:8px;">
          <label>Porcentaje sobre Honorarios (%)</label>
          <div class="number-input-wrapper">
            <button class="spin-btn" onclick="spinValue('gerryPercent', -1)">−</button>
            <input type="number" id="gerryPercent" value="25" min="0" step="1">
            <button class="spin-btn" onclick="spinValue('gerryPercent', 1)">+</button>
          </div>
          <p class="percent-hint">Se aplica como % sobre el total de honorarios</p>
        </div>
        <button class="btn btn-primary" onclick="calculate()" style="margin-top:14px;">Calcular Total</button>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <h2>Desglose</h2>
        <p class="editable-hint">✏️ Puedes editar cualquier valor del desglose</p>
        <div class="desglose-row">
          <label>Honorarios</label>
          <input type="number" id="dHonorarios" value="0.00" step="0.01">
        </div>
        <div class="desglose-row" id="dGerryRow" style="display:none;">
          <label>Impuesto Gerry (<span id="gerryPercentLabel">25</span>%)</label>
          <input type="number" id="dGerry" value="0.00" step="0.01">
        </div>
        <div class="desglose-row">
          <label>Subtotal (base IVA)</label>
          <input type="number" id="dSubtotal" value="0.00" step="0.01" readonly style="opacity:0.7;">
        </div>
        <div class="desglose-row">
          <label>IVA (<span id="ivaLabel">16</span>%)</label>
          <input type="number" id="dIva" value="0.00" step="0.01">
        </div>
        <div class="total-row">
          <span>Total</span>
          <span id="dTotal">$0.00</span>
        </div>
      </div>

      <div class="card">
        <button class="btn btn-primary" onclick="generatePDF()">🖨️ Generar Ticket PDF</button>
        <button class="btn btn-secondary" onclick="resetAll()" style="margin-top:10px;">Limpiar Todo</button>
      </div>
    </div>
  </div>

  <footer>Alexis Pimentel ©</footer>
</div>

<script>
  const defaults = { base: 600, add: 50, ex: 30, iva: 16, gerry: 25 };
  let actas = [];

  function spinValue(inputId, delta) {
    const input = document.getElementById(inputId);
    const current = parseFloat(input.value) || 0;
    const min = parseFloat(input.min) || 0;
    const newVal = Math.max(min, current + delta);
    input.value = newVal;
  }

  function addActa() {
    const id = Date.now() + Math.random();
    actas.push({ id, nombre: '', hojas: 1, copias: 1 });
    renderActas();
  }

  function removeActa(id) {
    actas = actas.filter(a => a.id !== id);
    renderActas();
  }

  function updateActa(id, field, value) {
    const a = actas.find(x => x.id === id);
    if (a) {
      if (field === 'nombre') a.nombre = value;
      else if (field === 'hojas') a.hojas = Math.max(1, parseInt(value) || 1);
      else if (field === 'copias') a.copias = Math.max(1, parseInt(value) || 1);
    }
  }

  function renderActas() {
    const list = document.getElementById('actasList');
    if (actas.length === 0) {
      list.innerHTML = '<p style="color:#64748b; text-align:center; padding:20px; font-size:0.9rem;">No hay actas agregadas</p>';
      return;
    }
    list.innerHTML = actas.map(a => `
      <div class="acta-item">
        <button class="btn btn-danger remove-btn" onclick="removeActa(${a.id})">✕</button>
        <div class="field">
          <label>Nombre del Acta</label>
          <input type="text" value="${a.nombre}" placeholder="Ej. Acta de Nacimiento" onchange="updateActa(${a.id}, 'nombre', this.value)">
        </div>
        <div class="row">
          <div class="field">
            <label>Número de Hojas</label>
            <div class="number-input-wrapper">
              <button class="spin-btn" onclick="spinActaField(${a.id}, 'hojas', -1)">−</button>
              <input type="number" min="1" value="${a.hojas}" onchange="updateActa(${a.id}, 'hojas', this.value)">
              <button class="spin-btn" onclick="spinActaField(${a.id}, 'hojas', 1)">+</button>
            </div>
          </div>
          <div class="field">
            <label>Número de Copias</label>
            <div class="number-input-wrapper">
              <button class="spin-btn" onclick="spinActaField(${a.id}, 'copias', -1)">−</button>
              <input type="number" min="1" value="${a.copias}" onchange="updateActa(${a.id}, 'copias', this.value)">
              <button class="spin-btn" onclick="spinActaField(${a.id}, 'copias', 1)">+</button>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }

  function spinActaField(id, field, delta) {
    const a = actas.find(x => x.id === id);
    if (a) {
      const current = a[field];
      const newVal = Math.max(1, current + delta);
      a[field] = newVal;
      renderActas();
    }
  }

  function restoreDefaults() {
    document.getElementById('priceBase').value = defaults.base;
    document.getElementById('priceAdd').value = defaults.add;
    document.getElementById('priceEx').value = defaults.ex;
    document.getElementById('ivaRate').value = defaults.iva;
    document.getElementById('gerryPercent').value = defaults.gerry;
  }

  function calculateActaCost(hojas) {
    const pBase = parseFloat(document.getElementById('priceBase').value) || 0;
    const pAdd = parseFloat(document.getElementById('priceAdd').value) || 0;
    const pEx = parseFloat(document.getElementById('priceEx').value) || 0;
    
    if (hojas <= 2) return pBase;
    else if (hojas < 100) return pBase + (hojas - 2) * pAdd;
    else return pBase + (97 * pAdd) + (hojas - 99) * pEx;
  }

  function calculate() {
    let honorarios = 0;
    actas.forEach(a => {
      const costoPorActa = calculateActaCost(a.hojas);
      honorarios += costoPorActa * a.copias;
    });

    const gerryOn = document.getElementById('gerryTax').checked;
    const gerryPercent = parseInt(document.getElementById('gerryPercent').value) || 0;
    const ivaRate = parseFloat(document.getElementById('ivaRate').value) || 0;

    // Impuesto Gerry = porcentaje sobre honorarios
    const gerryAmt = gerryOn ? honorarios * (gerryPercent / 100) : 0;

    // IVA se calcula sobre (Honorarios + Impuesto Gerry)
    const baseIva = honorarios + gerryAmt;
    const iva = baseIva * (ivaRate / 100);
    const subtotal = honorarios + gerryAmt;
    const total = document.getElementById('includeIvaTotal').checked ? subtotal + iva : subtotal;

    document.getElementById('dHonorarios').value = honorarios.toFixed(2);
    document.getElementById('dGerry').value = gerryAmt.toFixed(2);
    document.getElementById('dSubtotal').value = subtotal.toFixed(2);
    document.getElementById('dIva').value = iva.toFixed(2);
    document.getElementById('dTotal').textContent = '$' + total.toFixed(2);
    document.getElementById('ivaLabel').textContent = ivaRate;
    document.getElementById('gerryPercentLabel').textContent = gerryPercent;
  }

  // Mostrar/ocultar campos condicionales
  document.getElementById('gerryTax').addEventListener('change', e => {
    document.getElementById('gerryField').style.display = e.target.checked ? 'block' : 'none';
    document.getElementById('dGerryRow').style.display = e.target.checked ? 'grid' : 'none';
  });

  // Recalcular total cuando se edita el desglose manualmente
  ['dHonorarios','dGerry','dIva'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      const h = parseFloat(document.getElementById('dHonorarios').value) || 0;
      const g = parseFloat(document.getElementById('dGerry').value) || 0;
      const i = parseFloat(document.getElementById('dIva').value) || 0;
      const subtotal = h + g;
      document.getElementById('dSubtotal').value = subtotal.toFixed(2);
      const includeIva = document.getElementById('includeIvaTotal').checked;
      const total = includeIva ? subtotal + i : subtotal;
      document.getElementById('dTotal').textContent = '$' + total.toFixed(2);
    });
  });

  document.getElementById('includeIvaTotal').addEventListener('change', () => {
    const h = parseFloat(document.getElementById('dHonorarios').value) || 0;
    const g = parseFloat(document.getElementById('dGerry').value) || 0;
    const i = parseFloat(document.getElementById('dIva').value) || 0;
    const subtotal = h + g;
    const total = document.getElementById('includeIvaTotal').checked ? subtotal + i : subtotal;
    document.getElementById('dTotal').textContent = '$' + total.toFixed(2);
  });

  function resetAll() {
    document.getElementById('clientName').value = '';
    document.getElementById('deliveryDate').value = '';
    actas = [];
    renderActas();
    ['dHonorarios','dGerry','dIva'].forEach(id => document.getElementById(id).value = '0.00');
    document.getElementById('dSubtotal').value = '0.00';
    document.getElementById('dTotal').textContent = '$0.00';
  }

  function generatePDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const clientName = document.getElementById('clientName').value || 'Sin nombre';
    const deliveryDate = document.getElementById('deliveryDate').value || '---';
    const honorarios = parseFloat(document.getElementById('dHonorarios').value) || 0;
    const gerry = parseFloat(document.getElementById('dGerry').value) || 0;
    const gerryPercent = parseInt(document.getElementById('gerryPercent').value) || 0;
    const subtotal = parseFloat(document.getElementById('dSubtotal').value) || 0;
    const iva = parseFloat(document.getElementById('dIva').value) || 0;
    const totalText = document.getElementById('dTotal').textContent;
    const ivaRate = document.getElementById('ivaRate').value;

    // Encabezado
    doc.setFillColor(30, 30, 60);
    doc.rect(0, 0, 210, 35, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(20);
    doc.setFont('helvetica', 'bold');
    doc.text('Ticket de Cotejo', 105, 18, { align: 'center' });
    doc.setFontSize(10);
    doc.setFont('helvetica', 'normal');
    doc.text('Alexis Pimentel ©', 105, 28, { align: 'center' });

    doc.setTextColor(40, 40, 40);
    let y = 50;

    // Info cliente
    doc.setFontSize(12);
    doc.setFont('helvetica', 'bold');
    doc.text('Información del Cliente', 14, y);
    y += 8;
    doc.setFontSize(10);
    doc.setFont('helvetica', 'normal');
    doc.text(`Cliente: ${clientName}`, 14, y); y += 6;
    doc.text(`Fecha de entrega: ${deliveryDate}`, 14, y); y += 12;

    // Detalle de actas
    if (actas.length > 0) {
      doc.setFontSize(12);
      doc.setFont('helvetica', 'bold');
      doc.text('Detalle de Actas', 14, y);
      y += 8;
      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      
      actas.forEach(a => {
        doc.text(`• ${a.nombre || 'Sin nombre'} - ${a.hojas} hojas x ${a.copias} copias`, 14, y);
        y += 5;
      });
      y += 7;
    }

    // Desglose
    doc.setFontSize(12);
    doc.setFont('helvetica', 'bold');
    doc.text('Desglose', 14, y);
    y += 8;
    doc.setFontSize(10);
    doc.setFont('helvetica', 'normal');

    const fmt = v => '$' + v.toFixed(2);
    doc.text('Honorarios', 14, y); doc.text(fmt(honorarios), 196, y, { align: 'right' }); y += 6;
    if (gerry > 0) {
      doc.text(`Impuesto Gerry (${gerryPercent}% sobre honorarios)`, 14, y);
      doc.text(fmt(gerry), 196, y, { align: 'right' });
      y += 6;
    }
    doc.text(`Subtotal`, 14, y); doc.text(fmt(subtotal), 196, y, { align: 'right' }); y += 6;
    doc.text(`IVA (${ivaRate}%)`, 14, y); doc.text(fmt(iva), 196, y, { align: 'right' }); y += 10;

    // Total
    doc.setDrawColor(99, 102, 241);
    doc.setLineWidth(0.5);
    doc.line(14, y - 3, 196, y - 3);
    doc.setFontSize(13);
    doc.setFont('helvetica', 'bold');
    doc.text('TOTAL', 14, y + 3);
    doc.text(totalText, 196, y + 3, { align: 'right' });

    // Footer
    doc.setFontSize(8);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(120, 120, 120);
    doc.text('Gracias por su preferencia', 105, 280, { align: 'center' });

    doc.save(`Ticket_${clientName.replace(/\s+/g,'_') || 'cliente'}.pdf`);
  }

  // Inicializar
  renderActas();
  addActa();
</script>
</body>
</html>
